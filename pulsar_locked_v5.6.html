const bin=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
async function keyFromPw(pw,salt){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},km,
  {name:"AES-GCM",length:256},true,["decrypt"]);}
async function tryKey(key,iv,ct){
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
 const html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close();}
async function unlock(){
 const all=bin(BLOB),salt=all.slice(0,16),iv=all.slice(16,28),ct=all.slice(28);
 try{
  const key=await keyFromPw(document.getElementById("pw").value.trim(),salt);
  if(document.getElementById("rem").checked){
   const raw=await crypto.subtle.exportKey("raw",key);
   try{localStorage.setItem("pulsarK",btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}}
  await tryKey(key,iv,ct);
 }catch(e){document.getElementById("err").textContent="wrong passphrase";}}
(async()=>{ // auto-unlock if remembered
 let k=null;try{k=localStorage.getItem("pulsarK")}catch(_){}
 if(!k)return;
 try{const all=bin(BLOB),iv=all.slice(16,28),ct=all.slice(28);
  const key=await crypto.subtle.importKey("raw",bin(k),"AES-GCM",false,["decrypt"]);
  await tryKey(key,iv,ct);}catch(e){try{localStorage.removeItem("pulsarK")}catch(_){}}})();
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
</script></body></html>
