async function tryKey(key,iv,ct){
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
 const html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close();}
async function unlock(){
 const all=bin(BLOB),salt=all.slice(0,16),iv=all.slice(16,28),ct=all.slice(28);
 try{
  const key=await keyFromPw(document.getElementById("pw").value.trim(),salt);

  await tryKey(key,iv,ct);
 }catch(e){document.getElementById("err").textContent="wrong passphrase";}}
(async()=>{ // auto-unlock if remembered
 let k=null;try{k=localStorage.getItem("pulsarK")}catch(_){}
 if(!k)return;
 try{const all=bin(BLOB),iv=all.slice(16,28),ct=all.slice(28);

  await tryKey(key,iv,ct);}catch(e){try{localStorage.removeItem("pulsarK")}catch(_){}}})();
